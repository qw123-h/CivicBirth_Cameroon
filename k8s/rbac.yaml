---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: civicbirth-sa
  namespace: civicbirth-prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: civicbirth-role
  namespace: civicbirth-prod
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: civicbirth-rolebinding
  namespace: civicbirth-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: civicbirth-role
subjects:
- kind: ServiceAccount
  name: civicbirth-sa
  namespace: civicbirth-prod
