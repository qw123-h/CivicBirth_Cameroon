---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civicbirth-network-policy
  namespace: civicbirth-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443   # HTTPS for external APIs
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53    # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: civicbirth-prod
    ports:
    - protocol: TCP
      port: 3000  # Backend
    - protocol: TCP
      port: 80    # Frontend
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 80

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: civicbirth-quota
  namespace: civicbirth-prod
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "100"
    services: "20"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: civicbirth-limits
  namespace: civicbirth-prod
spec:
  limits:
  - type: Pod
    min:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "1"
      memory: "1Gi"
  - type: Container
    min:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "500m"
      memory: "512Mi"
    default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
