---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: civicbirth-cert
  namespace: civicbirth-prod
spec:
  secretName: civicbirth-tls
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  commonName: civicbirth.gov.cm
  dnsNames:
  - civicbirth.gov.cm
  - www.civicbirth.gov.cm
  - api.civicbirth.gov.cm
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicbirth-ingress
  namespace: civicbirth-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://civicbirth.gov.cm"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  tls:
  - hosts:
    - civicbirth.gov.cm
    - www.civicbirth.gov.cm
    - api.civicbirth.gov.cm
    secretName: civicbirth-tls
  rules:
  - host: civicbirth.gov.cm
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3000
  - host: www.civicbirth.gov.cm
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: api.civicbirth.gov.cm
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3000
