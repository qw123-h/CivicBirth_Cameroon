services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: civicbirth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-civicbirth}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicbirth-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: civicbirth-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@postgres:5432/${DB_NAME:-civicbirth}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-minimum-64-characters-long-for-production}
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      SUPABASE_URL: ${SUPABASE_URL:-https://example.supabase.co}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-local-development-supabase-service-key}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-certificates}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CERTIFICATE_VERIFY_BASE_URL: ${CERTIFICATE_VERIFY_BASE_URL:-http://localhost:5173/verify}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - civicbirth-network
    restart: unless-stopped
    command: >
      bash -c "sleep 5 && npx prisma db push --accept-data-loss && npm start"
    volumes:
      - ./logs:/app/logs

  # Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: civicbirth-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - civicbirth-network
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: civicbirth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@civicbirth.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - civicbirth-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  civicbirth-network:
    driver: bridge
