---
# Main playbook: Install Docker and Kubernetes tools
# Usage: ansible-playbook -i inventory/hosts.ini playbooks/setup-kubernetes.yml

- name: Setup Kubernetes and Docker on remote servers
  hosts: production,staging
  become: yes
  gather_facts: yes

  vars:
    docker_version: "24.0"
    kubectl_version: "1.28"
    helm_version: "3.12"
    docker_compose_version: "2.20.0"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - git
          - wget
          - jq
          - unzip
          - htop
          - net-tools
        state: present
      when: ansible_os_family == "Debian"

    # Docker Installation
    - name: Add Docker GPG key
      shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      creates: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Add Docker repository
      shell: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Install Docker Compose
      shell: |
        curl -L "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
      args:
        creates: /usr/local/bin/docker-compose

    - name: Start Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add deploy user to docker group
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: yes

    # Kubernetes Tools Installation
    - name: Add Kubernetes GPG key
      shell: curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/kubernetes-archive-keyring.gpg
      creates: /usr/share/keyrings/kubernetes-archive-keyring.gpg

    - name: Add Kubernetes repository
      shell: echo "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main" | tee /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: yes

    - name: Install Kubernetes tools
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        allow_downgrade: yes

    - name: Pin Kubernetes version
      shell: |
        apt-mark hold kubelet kubeadm kubectl

    # Helm Installation
    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # AWS CLI Installation (for cloud deployments)
    - name: Install AWS CLI v2
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        ./aws/install
        rm -rf aws awscliv2.zip
      args:
        creates: /usr/local/bin/aws

    # System Configuration
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_set: yes

    - name: Configure bridging
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "1"
        state: present
        sysctl_set: yes

    - name: Disable swap (required for Kubernetes)
      shell: swapoff -a

    - name: Remove swap entries from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+none\s+swap'
        state: absent

    # Security hardening
    - name: Configure auditd for Docker
      shell: |
        echo "-w /etc/docker -p wa" >> /etc/audit/rules.d/docker.rules
        augenrules --load

    - name: Set Docker daemon configuration
      template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
      notify: restart docker

    - name: Create docker config directory
      file:
        path: /root/.docker
        state: directory
        mode: '0700'

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

  post_tasks:
    - name: Verify Docker installation
      shell: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    - name: Verify kubectl installation
      shell: kubectl version --client --short
      register: kubectl_version
      changed_when: false

    - name: Display kubectl version
      debug:
        msg: "{{ kubectl_version.stdout }}"

    - name: Verify Helm installation
      shell: helm version --short
      register: helm_version
      changed_when: false

    - name: Display Helm version
      debug:
        msg: "{{ helm_version.stdout }}"

    - name: Display setup completion message
      debug:
        msg: |
          ✓ Docker {{ docker_version }} installed
          ✓ Kubernetes tools installed
          ✓ Helm {{ helm_version }} installed
          ✓ System configured for Kubernetes
          
          Next steps:
          1. Configure kubeconfig
          2. Join nodes to cluster (kubeadm join ...)
          3. Apply network plugin (flannel, calico, weave)
          4. Deploy applications
