---
# Playbook: Setup Firewall and Security
# Usage: ansible-playbook -i inventory/hosts.ini playbooks/setup-firewall.yml

- name: Configure firewall and security
  hosts: production,staging
  become: yes
  gather_facts: yes

  vars:
    allowed_ssh_ips:
      - "203.0.113.0/24"    # Admin network (change to your IP)
      - "198.51.100.0/24"   # CI/CD server IP

  tasks:
    # UFW (Uncomplicated Firewall) Configuration
    - name: Install UFW
      apt:
        name: ufw
        state: present
      when: ansible_os_family == "Debian"

    - name: Reset UFW to defaults
      shell: ufw --force reset

    - name: Enable UFW
      shell: ufw --force enable

    # SSH Access Rules
    - name: Configure UFW for SSH (with rate limiting)
      shell: ufw limit 22/tcp comment "SSH rate limited"

    # Allow SSH from specific IPs (more secure than allowing all)
    - name: Allow SSH from admin IPs
      shell: ufw allow from {{ item }} to any port 22 proto tcp
      loop: "{{ allowed_ssh_ips }}"

    # HTTP and HTTPS
    - name: Allow HTTP traffic
      shell: ufw allow 80/tcp comment "HTTP"

    - name: Allow HTTPS traffic
      shell: ufw allow 443/tcp comment "HTTPS"

    # Kubernetes specific ports
    - name: Allow Kubernetes API server
      shell: ufw allow 6443/tcp comment "Kubernetes API"

    - name: Allow kubelet API
      shell: ufw allow 10250/tcp comment "Kubelet API"

    - name: Allow Kubernetes service nodeport range
      shell: ufw allow 30000:32767/tcp comment "Kubernetes NodePort"

    # Internal communication (if in same VPC)
    - name: Allow internal Kubernetes communication
      shell: ufw allow from 10.0.0.0/8 comment "Internal network"

    # Database access (only from Kubernetes nodes)
    - name: Allow PostgreSQL from internal network
      shell: ufw allow from 10.0.0.0/8 to any port 5432 proto tcp

    # Monitoring ports
    - name: Allow Prometheus scraping
      shell: ufw allow from 10.0.0.0/8 to any port 9090 proto tcp

    - name: Allow node exporter
      shell: ufw allow from 10.0.0.0/8 to any port 9100 proto tcp

    # Jenkins CI/CD access (restrict to specific IPs)
    - name: Allow Jenkins from admin IPs
      shell: ufw allow from {{ item }} to any port 8080 proto tcp
      loop: "{{ allowed_ssh_ips }}"

    # Deny all other traffic by default
    - name: Deny incoming traffic by default
      shell: ufw default deny incoming

    - name: Allow outgoing traffic by default
      shell: ufw default allow outgoing

    # SSL/TLS Configuration
    - name: Create SSL certificates directory
      file:
        path: /etc/ssl/civicbirth
        state: directory
        mode: '0700'

    - name: Check if Let's Encrypt certificate exists
      stat:
        path: /etc/letsencrypt/live/civicbirth.example.com/fullchain.pem
      register: letsencrypt_cert

    # Fail2Ban for brute-force protection
    - name: Install Fail2Ban
      apt:
        name: fail2ban
        state: present

    - name: Create Fail2Ban Docker filter
      copy:
        dest: /etc/fail2ban/filter.d/docker.conf
        content: |
          [Definition]
          failregex = ^<HOST> .* "GET /login
          ignoreregex =

    - name: Create Fail2Ban local jail configuration
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 5

          [sshd]
          enabled = true

    - name: Start Fail2Ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started

    # Auditd Configuration
    - name: Install auditd
      apt:
        name: auditd
        state: present

    - name: Configure auditd rules
      copy:
        dest: /etc/audit/rules.d/civicbirth.rules
        content: |
          # Monitor Docker daemon
          -w /usr/bin/docker -p x
          -w /var/lib/docker -p wa
          -w /etc/docker -p wa
          
          # Monitor Kubernetes
          -w /usr/bin/kubelet -p x
          -w /var/lib/kubelet -p wa
          -w /etc/kubernetes -p wa
          
          # Monitor system calls
          -a exit,always -F arch=b64 -S execve -k exec

    - name: Load auditd rules
      shell: service auditd restart

    - name: Enable auditd
      systemd:
        name: auditd
        enabled: yes

    # Sysctl hardening
    - name: Harden sysctl settings
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: yes
      with_items:
        - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
        - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
        - { key: "net.ipv4.conf.default.send_redirects", value: "0" }
        - { key: "net.ipv4.tcp_timestamps", value: "0" }
        - { key: "kernel.randomize_va_space", value: "2" }

    # Log monitoring
    - name: Configure log rotation
      copy:
        dest: /etc/logrotate.d/civicbirth
        content: |
          /var/log/docker {
            daily
            rotate 7
            compress
            delaycompress
            notifempty
            create 0600 root root
            postrotate
              systemctl reload docker > /dev/null 2>&1 || true
            endscript
          }

  post_tasks:
    - name: Display firewall status
      shell: ufw status
      register: ufw_status
      changed_when: false

    - name: Show firewall configuration
      debug:
        msg: "{{ ufw_status.stdout_lines }}"

    - name: Display security hardening completion
      debug:
        msg: |
          ✓ Firewall configured (UFW)
          ✓ SSH access restricted
          ✓ Fail2Ban installed for brute-force protection
          ✓ Audit logging configured
          ✓ System hardened
          
          Review and adjust:
          1. Update allowed_ssh_ips with your actual IPs
          2. Configure SSL certificates
          3. Monitor /var/log/audit/audit.log
