# Ansible hosts inventory file
# Usage: ansible-playbook -i inventory/hosts.ini playbooks/setup.yml

[production]
civicbirth-main ansible_host=1.2.3.4 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/civicbirth.pem

[production:vars]
environment=production
deploy_user=civicbirth

[staging]
civicbirth-staging ansible_host=5.6.7.8 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/civicbirth-staging.pem

[staging:vars]
environment=staging
deploy_user=civicbirth

[development]
localhost ansible_connection=local

[development:vars]
environment=development
deploy_user=ubuntu
